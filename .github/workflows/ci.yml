name: Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            tox-env: py39
          - python-version: '3.10'
            tox-env: py310
          - python-version: '3.11'
            tox-env: py311

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      id: setup_python
      uses: actions/setup-python@v4
      continue-on-error: true
      with:
        python-version: ${{ matrix.python-version }}
    - name: Test with tox
      if: steps.setup_python.outcome == 'success'
      run: |
        pip install tox
        tox -e ${{ matrix.tox-env }}
    # Fall back to portable Python builds if setup-python cannot install the requested version.
    - name: Set up uv
      if: steps.setup_python.outcome == 'failure'
      uses: astral-sh/setup-uv@v6
    - name: Test with tox (uv fallback)
      if: steps.setup_python.outcome == 'failure'
      run: uv run --managed-python --no-project --python '${{ matrix.python-version }}' --with tox tox -e '${{ matrix.tox-env }}'
